<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#020617" />
    <title>You are offline | Muhammadov IELTS Reading</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #020617; color: #e2e8f0; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
      main { width: min(100%, 480px); padding: 32px; border: 1px solid #334155; border-radius: 24px; background: #0f172a; text-align: center; }
      .mark { color: #38bdf8; font-size: 14px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: 16px 0 12px; color: #fff; font-size: clamp(28px, 6vw, 40px); }
      p { color: #94a3b8; line-height: 1.7; }
      button { min-height: 44px; display: inline-flex; align-items: center; justify-content: center; margin: 12px 4px 0; padding: 0 18px; border: 1px solid #0ea5e9; border-radius: 12px; background: #0284c7; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
      button:focus-visible { outline: 3px solid #7dd3fc; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">Muhammadov IELTS Reading</div>
      <h1>You are offline</h1>
      <p>This page could not load because your device has no internet connection. Reconnect, then retry to continue your reading practice.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
